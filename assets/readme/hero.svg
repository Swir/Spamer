<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Message Sender — SWIR project hero</title>
  <desc id="desc">Dark electric-cyan banner for a controlled keyboard text automation utility.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050A"/><stop offset=".55" stop-color="#06101A"/><stop offset="1" stop-color="#02050A"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset=".45" stop-color="#62E5FF"/><stop offset="1" stop-color="#0088FF"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity=".25"/><rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <path d="M0 250C180 210 250 300 430 258S720 214 885 248s185 34 315-16" fill="none" stroke="url(#cyan)" stroke-opacity=".24" stroke-width="2"/>
  <g transform="translate(72 74)"><rect width="150" height="150" rx="30" fill="#07111C" stroke="#62E5FF" stroke-opacity=".5"/><rect x="25" y="34" width="100" height="70" rx="14" fill="#0A1724" stroke="#62E5FF" stroke-width="4"/><path d="M42 58h48M42 78h36M42 96h62" stroke="#8DA8B8" stroke-width="7" stroke-linecap="round"/><path d="M69 126h58m0 0-18-18m18 18-18 18" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/></g>
  <text x="270" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text>
  <text x="270" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#F4FAFF">MESSAGE SENDER</text>
  <text x="272" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#B8D2E0">Controlled keyboard text automation for testing and repetitive entry</text>
  <text x="272" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">PYTHON • TKINTER • PYNPUT • DESKTOP AUTOMATION</text>
</svg>